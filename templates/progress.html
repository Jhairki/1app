{% extends "base.html" %}
{% block content %}

<h1>Scanning</h1>
<p class="sub mono">{{ job.base_url }}</p>

<div class="panel">
  <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:12px">
    <span id="detalle" class="muted">Looking for the homepage navigation...</span>
    <span id="pct" class="faint num" style="margin-left:auto;font-size:13px"></span>
  </div>
  <div style="height:7px;background:var(--bg);border-radius:5px;overflow:hidden;border:1px solid var(--border)">
    <div id="barra" style="height:100%;width:0;background:var(--accent);transition:width .35s ease"></div>
  </div>
  <p class="hint" style="margin-top:14px">
    One second between requests, so the site is not hammered. You can leave this open.
  </p>
</div>

<script>
  const url = "{{ url_for('job_status', job_id=job_id) }}";
  const barra = document.getElementById("barra");
  const detalle = document.getElementById("detalle");
  const pct = document.getElementById("pct");

  async function revisar() {
    try {
      const respuesta = await fetch(url);
      const datos = await respuesta.json();

      if (datos.state === "done" || datos.state === "failed") {
        location.reload();
        return;
      }

      if (datos.total > 0) {
        const p = Math.round((datos.done / datos.total) * 100);
        barra.style.width = p + "%";
        pct.textContent = p + "%";
        detalle.textContent = `Page ${datos.done + 1} of ${datos.total}` +
          (datos.current ? ` — ${datos.current}` : "");
      } else if (datos.current) {
        detalle.textContent = `Checking ${datos.current}`;
      }
    } catch (e) {
      detalle.textContent = "Lost connection to the server.";
      return;
    }
    setTimeout(revisar, 1000);
  }

  revisar();
</script>

{% endblock %}
