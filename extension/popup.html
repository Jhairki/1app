<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>QA Page Exporter</title>
  <style>
    body {
      width: 260px;
      font: 13px/1.4 -apple-system, Segoe UI, Arial, sans-serif;
      padding: 12px;
      color: #1a1a1a;
    }
    p { margin: 0 0 10px; color: #555; }
    button {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #b8b8b8;
      border-radius: 6px;
      background: #f4f4f4;
      cursor: pointer;
    }
    button:hover { background: #e9e9e9; }
    button:disabled { opacity: 0.6; cursor: default; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #333;
      word-break: break-word;
    }
    #status.error { color: #b00020; }
    #status.ok { color: #0a7a2f; }
  </style>
</head>
<body>
  <p>Guarda el HTML ya cargado de esta pestaña, para compararlo luego contra
    la copia con <code>compare.py --source-dir</code>.</p>
  <button id="save">Guardar HTML de esta página</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
